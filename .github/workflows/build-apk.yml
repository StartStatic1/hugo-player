name: Build Hugo Player APK

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest -PversionCode=${{ github.run_number }} -PversionName=0.3.${{ github.run_number }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hugo-player-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build Release APK
        working-directory: apps/android
        run: |
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.3.${{ github.run_number }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hugo-player-release
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # Publica o APK como GitHub Release; /channels/latest.apk redireciona para releases/latest/download/app-release.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.3.${{ github.run_number }}" \
            apps/android/app/build/outputs/apk/release/app-release.apk \
            --title "Hugo Player 0.3.${{ github.run_number }}" \
            --notes "Build automático de ${{ github.sha }}" \
            --target "${{ github.sha }}" --latest

      # Atualiza update.json com o MESMO versionCode do APK publicado (evita aviso de atualização infinito)
      - name: Update version for in-app updates
        run: |
          printf '{"versionCode": %s, "versionName": "0.3.%s", "notes": "Atualização automática.", "apkUrl": "http://65.21.48.50:8080/channels/latest.apk"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" > apps/backend/update.json
          git config user.email "bot@hugo.player"
          git config user.name "Hugo Bot"
          git add apps/backend/update.json
          git commit -m "chore: update.json -> versionCode ${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
