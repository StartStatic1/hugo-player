name: Build Hugo Player APK

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hugo-player-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build Release APK
        if: success()
        working-directory: apps/android
        run: |
          ./gradlew assembleRelease

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hugo-player-release
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Update version for in-app updates
        if: success()
        run: |
          echo '{"versionCode": 3, "versionName": "0.3.0", "notes": "Atualização automática.", "apkUrl": "http://65.21.48.50:8080/channels/latest.apk"}' > apps/backend/update.json
          git config user.email "bot@hugo.player"
          git config user.name "Hugo Bot"
          git add apps/backend/update.json
          git commit -m "chore: auto update version" || true
          git push || true
