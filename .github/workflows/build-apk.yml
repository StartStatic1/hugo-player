name: Build Hugo Player APK

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      notes:
        description: "Notas da atualização (popup do app)"
        required: false
        default: "Melhorias e correções."

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Bump version (auto)
        id: ver
        working-directory: apps/android
        run: |
          set -e
          GRADLE="app/build.gradle.kts"
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$GRADLE" | head -1)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$GRADLE" | head -1)
          NEW_CODE=$((CODE + 1))
          # 0.5.0 -> 0.5.1 ou 0.6.0 se quiser; bump patch
          IFS='.' read -r MA MI PA <<< "$NAME"
          PA=${PA:-0}
          NEW_NAME="${MA}.${MI}.$((PA + 1))"
          sed -i -E "s/versionCode\s*=\s*[0-9]+/versionCode = ${NEW_CODE}/" "$GRADLE"
          sed -i -E "s/versionName\s*=\s*\"[^\"]*\"/versionName = \"${NEW_NAME}\"/" "$GRADLE"
          echo "code=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${CODE}/${NAME} -> ${NEW_CODE}/${NEW_NAME}"

      - name: Build Release APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-player-release-${{ steps.ver.outputs.name }}
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Update update.json (fonte do popup)
        run: |
          NOTES='${{ github.event.inputs.notes }}'
          if [ -z "$NOTES" ] || [ "$NOTES" = "null" ]; then
            NOTES="Hugo Player ${{ steps.ver.outputs.name }} — melhorias e correções."
          fi
          TAG="v${{ steps.ver.outputs.name }}"
          APK_URL="https://github.com/StartStatic1/hugo-player/releases/download/${TAG}/app-release.apk"
          cat > apps/backend/update.json << EOF
          {
            "versionCode": ${{ steps.ver.outputs.code }},
            "versionName": "${{ steps.ver.outputs.name }}",
            "notes": $(python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$NOTES"),
            "apkUrl": "${APK_URL}"
          }
          EOF
          cat apps/backend/update.json

      - name: Create GitHub Release + APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Hugo Player ${{ steps.ver.outputs.name }}
          body: |
            versionCode **${{ steps.ver.outputs.code }}**

            ${{ github.event.inputs.notes || 'Melhorias e correções.' }}
          files: apps/android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bump + update.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/app/build.gradle.kts apps/backend/update.json
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "release: v${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})"
          git push origin main
