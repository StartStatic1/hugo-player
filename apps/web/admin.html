<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hugo Player · Administração</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07080f;color:#f1f5f9;font:15px system-ui;padding:24px}main{max-width:980px;margin:auto}.card{background:#12141f;border:1px solid #1f2638;border-radius:16px;padding:22px;margin-bottom:16px}h1,h2{margin-top:0}label{display:block;color:#94a3b8;font-size:12px;text-transform:uppercase;margin:12px 0 6px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #1f2638;background:#0c0e18;color:#fff;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{padding:10px 13px;border:0;border-radius:10px;background:#8b5cf6;color:#fff;font-weight:700;cursor:pointer;margin:8px 8px 0 0}.ghost{background:#181b2a;border:1px solid #1f2638}.danger{background:#b91c1c}.status{margin-top:14px;color:#34d399;white-space:pre-wrap}.err{color:#f87171}.muted{color:#94a3b8;font-size:13px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{background:#0c0e18;border:1px solid #1f2638;border-radius:12px;padding:14px}.stat b{display:block;font-size:24px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.filters button{margin:0}.filters button.on{background:#8b5cf6}.devices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.device{background:#0c0e18;border:1px solid #1f2638;border-radius:14px;padding:16px}.device.premium{border-color:#8b5cf6}.device.blocked{border-color:#ef4444}.device .title{font-weight:800;font-family:monospace}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#20263a;color:#cbd5e1;font-size:12px;margin:6px 4px 6px 0}.badge.premium{background:#43218a;color:#e9d5ff}.badge.trial{background:#173b43;color:#a5f3fc}.badge.blocked{background:#5b1720;color:#fecaca}.warning{color:#fbbf24;font-size:12px;margin-top:8px}@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}.devices{grid-template-columns:1fr}.row{grid-template-columns:1fr}body{padding:14px}}
</style></head>
<body><main>
<div class="card"><h1>Hugo Player · Administração</h1><p class="muted">Painel protegido. O token nunca deve ser colocado no aplicativo.</p>
<label>API</label><input id="api" value="https://api-hugo.streamflixvip.online">
<label>Token administrativo</label><input id="token" type="password" autocomplete="off">
<label>Device ID para ação</label><input id="device" placeholder="02:AA:BB:CC:DD:EE">
<div class="row"><div><label>Plano</label><select id="plan"><option value="annual">Anual · 12 meses</option><option value="lifetime">Vitalício</option></select></div><div><label>Transação/teste</label><input id="tx" placeholder="manual-test"></div></div>
<button onclick="activate('annual')">Ativar anual</button><button onclick="activate('lifetime')">Ativar vitalício</button><button class="ghost" onclick="testTrial()">Gerar teste</button><button class="ghost" onclick="lookup()">Consultar ID</button><div id="status" class="status"></div></div>
<div class="card"><h2>Dispositivos</h2><button class="ghost" onclick="listDevices()">Atualizar lista</button><div id="summary" class="summary"></div><div class="filters"><button id="f-all" class="on" onclick="filterBy('all')">Todos</button><button id="f-premium" class="ghost" onclick="filterBy('premium')">Premium</button><button id="f-annual" class="ghost" onclick="filterBy('annual')">Anual</button><button id="f-life" class="ghost" onclick="filterBy('lifetime')">Vitalício</button><button id="f-trial" class="ghost" onclick="filterBy('trial')">Trials</button><button id="f-blocked" class="ghost" onclick="filterBy('blocked')">Bloqueados</button></div><div id="list" class="devices"><span class="muted">Clique em Atualizar lista.</span></div></div>
</main><script>
const $=id=>document.getElementById(id);const api=()=>$('api').value.replace(/\/+$/,'');let allDevices=[];let activeFilter='all';
async function call(path,method='GET',body){const r=await fetch(api()+path,{method,headers:{'Content-Type':'application/json','x-admin-token':$('token').value},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j}
function out(v,err=false){$('status').className='status'+(err?' err':'');$('status').textContent=typeof v==='string'?v:JSON.stringify(v,null,2)}
async function activate(plan){try{out(await call('/admin/devices/'+encodeURIComponent($('device').value.trim())+'/activate','POST',{plan,transactionNsu:$('tx').value.trim()||'manual-test'}));await listDevices()}catch(e){out(e.error||'Erro',true)}}
async function testTrial(){try{out(await call('/admin/devices/'+encodeURIComponent($('device').value.trim())+'/test','POST',{days:7}));await listDevices()}catch(e){out(e.error||'Erro',true)}}
async function lookup(){try{out(await call('/admin/devices?q='+encodeURIComponent($('device').value.trim())))}catch(e){out(e.error||'Erro',true)}}
	async function deviceAction(id,action){try{await call('/admin/devices/'+encodeURIComponent(id)+'/'+action,'POST',action==='block'?{reason:'bloqueado pelo administrador'}:{});await listDevices()}catch(e){out(e.error||'Erro',true)}}
	async function resetKey(id){if(!confirm('Gerar uma nova Key para este dispositivo? A Key anterior deixará de funcionar imediatamente.'))return;try{const r=await call('/admin/devices/'+encodeURIComponent(id)+'/reset-key','POST');out('Nova Key gerada para '+r.deviceId+'\n\nKEY: '+r.deviceKey+'\n\nGuarde esta Key agora. Ela não será exibida novamente.')}catch(e){out(e.error||'Erro ao gerar Key',true)}}
	async function revokeDevice(id){if(!confirm('Revogar o Premium deste dispositivo? O aparelho e as playlists serão preservados, mas o acesso ficará bloqueado até uma nova ativação.'))return;try{await call('/admin/devices/'+encodeURIComponent(id)+'/revoke','POST',{reason:'licença revogada pelo administrador'});out('Licença revogada. Dispositivo e playlists preservados.');await listDevices()}catch(e){out(e.error||'Erro',true)}}
async function removeDevice(id){if(!confirm('Excluir este trial sem playlists?'))return;try{await call('/admin/devices/'+encodeURIComponent(id),'DELETE');await listDevices()}catch(e){out(e.error==='device_has_playlists'?'Não pode excluir: este dispositivo possui playlists.':e.error||'Erro',true)}}
function filterBy(f){activeFilter=f;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('on'));$('f-'+(f==='all'?'all':f==='annual'?'annual':f==='lifetime'?'life':f)).classList.add('on');render()}
	function render(){const ds=allDevices.filter(d=>{const p=d.license.plan||d.license.type;if(activeFilter==='premium')return d.license.type==='premium';if(activeFilter==='annual')return p==='annual';if(activeFilter==='lifetime')return p==='lifetime';if(activeFilter==='trial')return p==='trial';if(activeFilter==='blocked')return Boolean(d.blockedAt);return true});$('list').innerHTML=ds.map(d=>{const p=d.license.plan||d.license.type,blocked=Boolean(d.blockedAt),revoked=Boolean(d.revokedAt),premium=d.license.type==='premium',exp=d.license.expiresAt?new Date(d.license.expiresAt).toLocaleDateString('pt-BR'):'sem vencimento';return `<div class="device ${premium?'premium':''} ${blocked?'blocked':''}"><div class="title">${d.deviceId}</div><span class="badge ${premium?'premium':'trial'}">${p==='annual'?'Premium Anual':p==='lifetime'?'Premium Vitalício':revoked?'Revogada':'Teste'}</span>${blocked?'<span class="badge blocked">Bloqueado</span>':''}${revoked?'<span class="badge blocked">Revogada</span>':''}<div class="muted">${d.platform} · ${revoked?'revogada em '+exp:exp} · ${d.playlistCount||0} playlist(s)</div>${d.transferredTo?`<div class="muted">⇄ transferido para ${d.transferredTo} em ${new Date(d.transferredAt).toLocaleString('pt-BR')}</div>`:''}${d.transferredFrom?`<div class="muted">⇄ recebido de ${d.transferredFrom} em ${new Date(d.transferredAt).toLocaleString('pt-BR')}</div>`:''}${!premium&&d.playlistCount?' <div class="warning">Possui playlists: exclusão protegida</div>':''}<button class="ghost" onclick="deviceAction('${d.deviceId}','${blocked?'unblock':'block'}')">${blocked?'Desbloquear':'Bloquear'}</button><button class="ghost" onclick="resetKey('${d.deviceId}')">Gerar nova Key</button>${premium?`<button class="danger" onclick="revokeDevice('${d.deviceId}')">Revogar Premium</button>`:''}${!premium&&!revoked&&!d.playlistCount?`<button class="danger" onclick="removeDevice('${d.deviceId}')">Excluir trial</button>`:''}</div>`}).join('')||'<span class="muted">Nenhum dispositivo neste filtro.</span>'}
function updateSummary(){const n=allDevices;const premium=n.filter(d=>d.license.type==='premium').length;const annual=n.filter(d=>(d.license.plan||d.license.type)==='annual').length;const life=n.filter(d=>(d.license.plan||d.license.type)==='lifetime').length;const trial=n.filter(d=>(d.license.plan||d.license.type)==='trial').length;$('summary').innerHTML=`<div class="stat"><b>${premium}</b><span class="muted">Premium</span></div><div class="stat"><b>${annual}</b><span class="muted">Anuais</span></div><div class="stat"><b>${life}</b><span class="muted">Vitalícios</span></div><div class="stat"><b>${trial}</b><span class="muted">Trials</span></div>`}
async function listDevices(){try{const j=await call('/admin/devices');allDevices=j.devices||[];updateSummary();render()}catch(e){out(e.error||'Erro',true)}}
</script></body></html>
