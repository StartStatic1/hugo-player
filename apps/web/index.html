<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hugo Player - Ativação</title>
<style>
:root { --bg:#0b0d17; --card:#151827; --primary:#7c5cff; --text:#e6e8f2; --muted:#9aa0b8; }
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);padding:32px;border-radius:16px;width:100%;max-width:440px;border:1px solid #ffffff12}
h1{margin:0 0 8px;text-align:center;font-size:28px}
.subtitle{color:var(--muted);text-align:center;margin:0 0 28px;font-size:14px}
label{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px}
input,select,button{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #ffffff1a;background:#0b0d17;color:var(--text);font-size:15px}
button{background:var(--primary);border:none;font-weight:600;cursor:pointer;margin-top:20px}
button:hover{opacity:.9}
.status{margin-top:16px;padding:12px;border-radius:8px;font-size:14px;display:none}
.status.ok{background:#34d39922;color:#34d399;display:block}
.status.err{background:#f8717122;color:#f87171;display:block}
.mono{font-family:ui-monospace,monospace;letter-spacing:1px}
</style>
</head>
<body>
<div class="card">
  <h1>Hugo Player</h1>
  <p class="subtitle">Ative seu dispositivo</p>

  <label>Device ID</label>
  <input id="deviceId" class="mono" placeholder="AA:BB:CC:DD:EE:FF" autocomplete="off">

  <label>Device Key</label>
  <input id="deviceKey" class="mono" placeholder="8 caracteres" maxlength="8" autocomplete="off">

  <label>Playlist (M3U ou Xtream)</label>
  <input id="playlistUrl" placeholder="https://...">

  <label>Nome da playlist</label>
  <input id="playlistName" placeholder="Minha Lista" value="Principal">

  <button onclick="activate()">Ativar Dispositivo</button>

  <div id="status" class="status"></div>
</div>

<script>
const API = "http://65.21.48.50:8080";

async function activate() {
  const deviceId = document.getElementById("deviceId").value.trim().toUpperCase();
  const deviceKey = document.getElementById("deviceKey").value.trim().toUpperCase();
  const url = document.getElementById("playlistUrl").value.trim();
  const name = document.getElementById("playlistName").value.trim() || "Principal";
  const status = document.getElementById("status");

  if (!deviceId || !deviceKey || !url) {
    show("Preencha Device ID, Key e URL da playlist", "err");
    return;
  }

  try {
    // 1. Register / check device
    const reg = await fetch(API + "/devices/register", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ deviceId, deviceKey, platform:"web" })
    });
    if (!reg.ok) {
      const err = await reg.json();
      throw new Error(err.error || "Erro no registro");
    }

    // 2. Add playlist
    const pl = await fetch(API + "/playlists", {
      method: "POST",
      headers: {
        "Content-Type":"application/json",
        "x-device-id": deviceId,
        "x-device-key": deviceKey
      },
      body: JSON.stringify({ name, type:"m3u", url })
    });

    if (!pl.ok) {
      const err = await pl.json();
      throw new Error(err.error || "Erro ao adicionar playlist");
    }

    show("Dispositivo ativado com sucesso! Abra o app e atualize.", "ok");
  } catch (e) {
    show(e.message, "err");
  }
}

function show(msg, type) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status " + type;
}
</script>
</body>
</html>
