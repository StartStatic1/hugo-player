<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hugo Player</title>
  <style>
    body { font-family: system-ui; background: #0b0d17; color: #fff; max-width: 480px; margin: 40px auto; padding: 20px; }
    h1 { text-align: center; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #151827; color: #fff; }
    button { background: #7c5cff; border: none; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Hugo Player</h1>
  <p>Informe o Device ID e Device Key do aplicativo.</p>
  <input id="deviceId" placeholder="Device ID" />
  <input id="deviceKey" placeholder="Device Key" />
  <button>Entrar</button>
  <p style="text-align:center;margin-top:40px;color:#9aa0b8;">Hugo Player — apenas um player. Você carrega suas próprias playlists.</p>
</body>
</html>
